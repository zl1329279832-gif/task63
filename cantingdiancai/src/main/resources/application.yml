# ============================================================
# 餐厅点餐管理系统 — 公共配置 (base)
# 环境差异项放在 application-dev.yml / application-prod.yml
# 启动时通过 SPRING_PROFILES_ACTIVE=dev|prod 切换
# ============================================================

# Tomcat
server:
    tomcat:
        uri-encoding: UTF-8
    port: 8080
    servlet:
        context-path: /cantingdiancai

spring:
    profiles:
        active: dev                 # 默认激活 dev，生产部署时由环境变量覆盖
    resources:
        static-locations: classpath:static/,file:static/

# mybatis-plus
mybatis-plus:
    mapper-locations: classpath*:mapper/*.xml
    typeAliasesPackage: com.entity
    global-config:
        id-type: 1
        field-strategy: 2
        db-column-underline: true
        refresh-mapper: true
        logic-delete-value: -1
        logic-not-delete-value: 0
        sql-injector: com.baomidou.mybatisplus.mapper.LogicSqlInjector
    configuration:
        map-underscore-to-camel-case: true
        cache-enabled: false
        call-setters-on-nulls: true
        jdbc-type-for-null: 'null'
